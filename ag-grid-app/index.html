<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ops Pulse Grid</title>
    <meta name="description" content="서비스 배포 현황 대시보드" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@34.1.2/dist/ag-grid-community.min.js"></script>
  </head>
  <body>

    <!-- 상단 네비 바 -->
    <nav class="topbar">
      <a class="topbar-logo" href="#">
        <!-- Copilot 스타일 그라디언트 아이콘 -->
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="cg" x1="0" y1="0" x2="22" y2="22" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#5b6cf9"/>
              <stop offset="50%" stop-color="#a855f7"/>
              <stop offset="100%" stop-color="#ec4899"/>
            </linearGradient>
          </defs>
          <rect width="22" height="22" rx="6" fill="url(#cg)"/>
          <path d="M6 11a5 5 0 1 0 10 0A5 5 0 0 0 6 11Z" fill="white" opacity="0.9"/>
          <circle cx="11" cy="11" r="2.5" fill="url(#cg)"/>
        </svg>
        Ops Pulse
      </a>
      <div class="topbar-divider"></div>
      <span class="topbar-title">서비스 배포 현황</span>
    </nav>

    <div class="shell">
      <!-- 히어로 -->
      <header class="hero">
        <div class="hero-copy">
          <p class="eyebrow">✦ Deployment Dashboard</p>
          <h1>서비스 배포 현황</h1>
          <p class="hero-text">
            인스턴스 상태, 담당자, 배포 진행률을 실시간으로 탐색하고
            필터링합니다.
          </p>
        </div>
        <div class="hero-panel">
          <div class="metric-card">
            <span class="metric-label">Active Services</span>
            <strong id="activeServices">0</strong>
          </div>
          <div class="metric-card">
            <span class="metric-label">Avg Progress</span>
            <strong id="avgProgress">0%</strong>
          </div>
          <div class="metric-card">
            <span class="metric-label">Urgent Items</span>
            <strong id="urgentItems">0</strong>
          </div>
        </div>
      </header>

      <main class="workspace">
        <!-- 툴바 -->
        <section class="toolbar">
          <label class="search-field" for="quickFilter">
            <span>검색</span>
            <input
              id="quickFilter"
              type="search"
              placeholder="서비스명, 담당자, 리전으로 검색"
            />
          </label>

          <div class="toolbar-actions">
            <button type="button" class="chip is-active" data-filter="all">전체</button>
            <button type="button" class="chip" data-filter="healthy">Healthy</button>
            <button type="button" class="chip" data-filter="warning">Warning</button>
            <button type="button" class="chip" data-filter="critical">Critical</button>
            <button type="button" class="ghost-button" id="resetFilters">초기화</button>
          </div>
        </section>

        <!-- 그리드 패널 -->
        <section class="panel">
          <div class="panel-head">
            <div>
              <p class="panel-kicker">Deployment Board</p>
              <h2>운영 서비스 목록</h2>
            </div>
            <div class="legend">
              <span><i class="dot healthy"></i> Healthy</span>
              <span><i class="dot warning"></i> Warning</span>
              <span><i class="dot critical"></i> Critical</span>
            </div>
          </div>

          <div id="serviceGrid" class="ag-theme-quartz grid-frame"></div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
