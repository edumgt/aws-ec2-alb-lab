name: ECR → EC2 배포

# BE-fastapi 또는 ag-grid-app 코드 변경 시 자동 트리거
on:
  push:
    branches: [main]
    paths:
      - 'BE-fastapi/**'
      - 'ag-grid-app/**'
      - '.github/workflows/deploy-ecr-ec2.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION:   ap-northeast-2
  ECR_REGISTRY: 086015456585.dkr.ecr.ap-northeast-2.amazonaws.com
  BE_IMAGE:     086015456585.dkr.ecr.ap-northeast-2.amazonaws.com/be-test
  FE_IMAGE:     086015456585.dkr.ecr.ap-northeast-2.amazonaws.com/fe-test

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      # ── AWS 자격 증명 (Access Key) ────────────────────────────────
      # Secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ── ECR 로그인 ────────────────────────────────────────────────
      - name: ECR 로그인
        uses: aws-actions/amazon-ecr-login@v2

      # ── BE 이미지 빌드 및 ECR 푸시 ───────────────────────────────
      - name: BE 이미지 빌드 및 ECR 푸시
        run: |
          docker build -t "$BE_IMAGE:latest" ./BE-fastapi
          docker push "$BE_IMAGE:latest"

      
      - name: FE 이미지 빌드 및 ECR 푸시
        run: |
          docker build -t "$FE_IMAGE:latest" ./ag-grid-app
          docker push "$FE_IMAGE:latest"
