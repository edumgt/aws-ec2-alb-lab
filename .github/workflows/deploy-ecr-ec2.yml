name: ECR → EC2 배포

# BE-fastapi 또는 ag-grid-app 코드 변경 시 자동 트리거
on:
  push:
    branches: [main]
    paths:
      - 'BE-fastapi/**'
      - 'ag-grid-app/**'
      - '.github/workflows/deploy-ecr-ec2.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION:   ap-northeast-2
  ECR_REGISTRY: 086015456585.dkr.ecr.ap-northeast-2.amazonaws.com
  BE_IMAGE:     086015456585.dkr.ecr.ap-northeast-2.amazonaws.com/be-test
  FE_IMAGE:     086015456585.dkr.ecr.ap-northeast-2.amazonaws.com/fe-test

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      # ── AWS 자격 증명 (Access Key) ────────────────────────────────
      # Secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ── ECR 로그인 ────────────────────────────────────────────────
      - name: ECR 로그인
        uses: aws-actions/amazon-ecr-login@v2

      # ── BE 이미지 빌드 및 ECR 푸시 ───────────────────────────────
      - name: BE 이미지 빌드 및 ECR 푸시
        id: build-be
        run: |
          docker build -t "$BE_IMAGE:latest" \
                       -t "$BE_IMAGE:${{ github.sha }}" \
                       ./BE-fastapi
          docker push "$BE_IMAGE:latest"
          docker push "$BE_IMAGE:${{ github.sha }}"
          echo "be_image=$BE_IMAGE:latest" >> "$GITHUB_OUTPUT"

      # ── FE 이미지 빌드 및 ECR 푸시 ───────────────────────────────
      - name: FE 이미지 빌드 및 ECR 푸시
        id: build-fe
        run: |
          docker build -t "$FE_IMAGE:latest" \
                       -t "$FE_IMAGE:${{ github.sha }}" \
                       ./ag-grid-app
          docker push "$FE_IMAGE:latest"
          docker push "$FE_IMAGE:${{ github.sha }}"
          echo "fe_image=$FE_IMAGE:latest" >> "$GITHUB_OUTPUT"

      # ── EC2 SSH 접속 → ECR pull → 컨테이너 교체 배포 ─────────────
      # Secrets: EC2_HOST, EC2_USER, EC2_SSH_KEY
      # EC2에 AmazonEC2ContainerRegistryReadOnly IAM 역할이 연결되어 있어야 합니다.
      - name: EC2 배포 (SSH)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            BE_IMAGE="${{ steps.build-be.outputs.be_image }}"
            FE_IMAGE="${{ steps.build-fe.outputs.fe_image }}"

            aws ecr get-login-password --region ap-northeast-2 | \
              docker login --username AWS --password-stdin 086015456585.dkr.ecr.ap-northeast-2.amazonaws.com

            docker pull "$BE_IMAGE"
            docker pull "$FE_IMAGE"

            docker stop fastapi-app 2>/dev/null || true
            docker rm   fastapi-app 2>/dev/null || true
            docker run -d \
              --name fastapi-app \
              --restart unless-stopped \
              -p 8000:8000 \
              "$BE_IMAGE"

            docker stop fe-ag-grid 2>/dev/null || true
            docker rm   fe-ag-grid 2>/dev/null || true
            docker run -d \
              --name fe-ag-grid \
              --restart unless-stopped \
              -p 80:80 \
              "$FE_IMAGE"

            docker image prune -f

            sleep 3
            curl -sf http://localhost:8000/health || \
              (echo "BE 헬스체크 실패"; docker logs fastapi-app --tail 30; exit 1)
            curl -sf http://localhost:80/ || \
              (echo "FE 헬스체크 실패"; docker logs fe-ag-grid --tail 30; exit 1)
