name: ECR 빌드 & EC2 배포

on:
  push:
    branches: [main]
    paths:
      - 'BE-fastapi/**'
      - 'ag-grid-app/**'
      - '.github/workflows/deploy-ecr-ec2.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION:   ap-northeast-2
  ECR_REGISTRY: 086015456585.dkr.ecr.ap-northeast-2.amazonaws.com
  BE_IMAGE:     086015456585.dkr.ecr.ap-northeast-2.amazonaws.com/be-test:latest
  FE_IMAGE:     086015456585.dkr.ecr.ap-northeast-2.amazonaws.com/fe-test:latest

jobs:
  # ── 1. ECR 빌드 & 푸시 ────────────────────────────────────────────
  build-push:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        uses: aws-actions/amazon-ecr-login@v2

      - name: BE 이미지 빌드 및 ECR 푸시
        run: |
          docker build -t "$BE_IMAGE" ./BE-fastapi
          docker push "$BE_IMAGE"

      - name: FE 이미지 빌드 및 ECR 푸시
        run: |
          docker build -t "$FE_IMAGE" ./ag-grid-app
          docker push "$FE_IMAGE"

  # ── 2. EC2 배포 (build-push 성공 후 실행) ────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build-push

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: EC2 SSH → Docker Pull & Run
        uses: appleboy/ssh-action@v1
        with:
          host: 43.203.255.251
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY
          script: |
            # ── AWS CLI 설치 확인 및 설치 ────────────────────────────
            if ! command -v aws &>/dev/null; then
              curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
              unzip -q /tmp/awscliv2.zip -d /tmp
              sudo /tmp/aws/install
              rm -rf /tmp/awscliv2.zip /tmp/aws
            fi

            # ── ECR 로그인 ────────────────────────────────────────────
            AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
            AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
            aws ecr get-login-password --region ap-northeast-2 | \
              docker login --username AWS --password-stdin \
              086015456585.dkr.ecr.ap-northeast-2.amazonaws.com

            # ── Pull ─────────────────────────────────────────────────
            docker pull 086015456585.dkr.ecr.ap-northeast-2.amazonaws.com/be-test:latest
            docker pull 086015456585.dkr.ecr.ap-northeast-2.amazonaws.com/fe-test:latest

            # ── BE 실행 ──────────────────────────────────────────────
            docker stop fastapi-app 2>/dev/null || true
            docker rm   fastapi-app 2>/dev/null || true
            docker run -d \
              --name fastapi-app \
              --restart unless-stopped \
              -p 8000:8000 \
              086015456585.dkr.ecr.ap-northeast-2.amazonaws.com/be-test:latest

            # ── FE 실행 ──────────────────────────────────────────────
            docker stop fe-ag-grid 2>/dev/null || true
            docker rm   fe-ag-grid 2>/dev/null || true
            docker run -d \
              --name fe-ag-grid \
              --restart unless-stopped \
              -p 80:80 \
              086015456585.dkr.ecr.ap-northeast-2.amazonaws.com/fe-test:latest

            # ── 확인 ────────────────────────────────────────────────
            echo "=============================="
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            echo "=============================="
