name: ag-grid-app → FTP 배포

# ag-grid-app 코드 변경 시 자동 트리거
on:
  push:
    branches: [main]
    paths:
      - 'ag-grid-app/**'
      - '.github/workflows/deploy-ftp-ag-grid.yml'
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      # ── FTP 업로드 ─────────────────────────────────────────────────
      # Secrets: FTP_HOST, FTP_USERNAME, FTP_PASSWORD
      - name: FTP 배포
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ag-grid-app/
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            **/README.md
