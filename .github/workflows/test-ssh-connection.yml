name: EC2 Docker Pull & Run


on:
  workflow_run:
    workflows: ["ECR → EC2 배포"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  BE_IMAGE: 086015456585.dkr.ecr.ap-northeast-2.amazonaws.com/be-test:latest
  FE_IMAGE: 086015456585.dkr.ecr.ap-northeast-2.amazonaws.com/fe-test:latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    # workflow_run 으로 실행된 경우 배포 성공 시에만 수행
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: EC2 SSH → Docker Pull & Run
        uses: appleboy/ssh-action@v1
        with:
          host: 43.203.255.251
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY
          script: |
            # ── AWS CLI 설치 확인 및 설치 ────────────────────────────
            if ! command -v aws &>/dev/null; then
              curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
              unzip -q /tmp/awscliv2.zip -d /tmp
              sudo /tmp/aws/install
              rm -rf /tmp/awscliv2.zip /tmp/aws
            fi

            # ── ECR 로그인 ────────────────────────────────────────────
            AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
            AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
            aws ecr get-login-password --region ap-northeast-2 | \
              docker login --username AWS --password-stdin \
              086015456585.dkr.ecr.ap-northeast-2.amazonaws.com

            # ── Pull ─────────────────────────────────────────────────
            docker pull 086015456585.dkr.ecr.ap-northeast-2.amazonaws.com/be-test:latest
            docker pull 086015456585.dkr.ecr.ap-northeast-2.amazonaws.com/fe-test:latest

            # ── BE 실행 ──────────────────────────────────────────────
            docker stop fastapi-app 2>/dev/null || true
            docker rm   fastapi-app 2>/dev/null || true
            docker run -d \
              --name fastapi-app \
              --restart unless-stopped \
              -p 8000:8000 \
              086015456585.dkr.ecr.ap-northeast-2.amazonaws.com/be-test:latest

            # ── FE 실행 ──────────────────────────────────────────────
            docker stop fe-ag-grid 2>/dev/null || true
            docker rm   fe-ag-grid 2>/dev/null || true
            docker run -d \
              --name fe-ag-grid \
              --restart unless-stopped \
              -p 80:80 \
              086015456585.dkr.ecr.ap-northeast-2.amazonaws.com/fe-test:latest

            # ── 확인 ────────────────────────────────────────────────
            echo "=============================="
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            echo "=============================="
