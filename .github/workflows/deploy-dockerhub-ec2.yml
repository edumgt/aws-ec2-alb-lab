name: Docker Hub → EC2 배포

# BE-fastapi 또는 ag-grid-app 코드 변경 시 자동 트리거
on:
  push:
    branches: [main]
    paths:
      - 'BE-fastapi/**'
      - 'ag-grid-app/**'
      - '.github/workflows/deploy-dockerhub-ec2.yml'
  workflow_dispatch:

jobs:
  # ── BE 이미지 빌드 및 Docker Hub 푸시 ──────────────────────────────
  build-be:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: BE 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: ./BE-fastapi
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/be-fastapi-hello:latest
            ${{ vars.DOCKERHUB_USERNAME }}/be-fastapi-hello:${{ github.sha }}

  # ── FE 이미지 빌드 및 Docker Hub 푸시 ──────────────────────────────
  build-fe:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: FE 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: ./ag-grid-app
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/fe-ag-grid:latest
            ${{ vars.DOCKERHUB_USERNAME }}/fe-ag-grid:${{ github.sha }}

  