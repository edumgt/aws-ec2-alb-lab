name: Docker Hub → EC2 배포

# BE-fastapi 또는 ag-grid-app 코드 변경 시 자동 트리거
on:
  push:
    branches: [main]
    paths:
      - 'BE-fastapi/**'
      - 'ag-grid-app/**'
      - '.github/workflows/deploy-dockerhub-ec2.yml'
  workflow_dispatch:

jobs:
  # ── BE 이미지 빌드 및 Docker Hub 푸시 ──────────────────────────────
  build-be:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: BE 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: ./BE-fastapi
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/be-fastapi-hello:latest
            ${{ vars.DOCKERHUB_USERNAME }}/be-fastapi-hello:${{ github.sha }}

  # ── FE 이미지 빌드 및 Docker Hub 푸시 ──────────────────────────────
  build-fe:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: FE 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: ./ag-grid-app
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/fe-ag-grid:latest
            ${{ vars.DOCKERHUB_USERNAME }}/fe-ag-grid:${{ github.sha }}

  # ── EC2 SSH 접속 → BE + FE 컨테이너 교체 배포 ─────────────────────
  # Secrets: EC2_HOST, EC2_USER, SSH_PRIVATE_KEY, DOCKERHUB_TOKEN
  # Variables: DOCKERHUB_USERNAME
  # EC2 보안그룹에 GitHub Actions IP 범위(22/80/8000)가 허용되어 있어야 합니다.
  deploy:
    runs-on: ubuntu-latest
    needs: [build-be, build-fe]

    steps:
      - name: EC2 배포 (SSH)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            BE_IMAGE="${{ vars.DOCKERHUB_USERNAME }}/be-fastapi-hello:latest"
            FE_IMAGE="${{ vars.DOCKERHUB_USERNAME }}/fe-ag-grid:latest"

            # ── BE 배포 ────────────────────────────────────────────────
            docker pull "$BE_IMAGE"
            docker stop fastapi-app 2>/dev/null || true
            docker rm   fastapi-app 2>/dev/null || true
            docker run -d \
              --name fastapi-app \
              --restart unless-stopped \
              -p 8000:8000 \
              "$BE_IMAGE"

            # ── FE 배포 ────────────────────────────────────────────────
            docker pull "$FE_IMAGE"
            docker stop ag-grid-app 2>/dev/null || true
            docker rm   ag-grid-app 2>/dev/null || true
            docker run -d \
              --name ag-grid-app \
              --restart unless-stopped \
              -p 80:80 \
              "$FE_IMAGE"

            # ── 오래된 이미지 정리 ─────────────────────────────────────
            docker image prune -f

            # ── 헬스체크 ───────────────────────────────────────────────
            sleep 3
            curl -sf http://localhost:8000/health || \
              (echo "BE 헬스체크 실패:"; docker logs fastapi-app --tail 30; exit 1)
            curl -sf http://localhost:80 || \
              (echo "FE 헬스체크 실패:"; docker logs ag-grid-app --tail 30; exit 1)
