name: Docker Hub → EC2 배포

# BE-fastapi 또는 ag-grid-app 코드 변경 시 자동 트리거
on:
  push:
    branches: [main]
    paths:
      - 'BE-fastapi/**'
      - 'ag-grid-app/**'
      - '.github/workflows/deploy-dockerhub-ec2.yml'
  workflow_dispatch:

jobs:
  # ── BE 이미지 빌드 및 Docker Hub 푸시 ──────────────────────────────
  build-be:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: BE 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: ./BE-fastapi
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/be-fastapi-hello:latest
            ${{ vars.DOCKERHUB_USERNAME }}/be-fastapi-hello:${{ github.sha }}

  # ── FE 이미지 빌드 및 Docker Hub 푸시 ──────────────────────────────
  build-fe:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: FE 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: ./ag-grid-app
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/fe-ag-grid:latest
            ${{ vars.DOCKERHUB_USERNAME }}/fe-ag-grid:${{ github.sha }}

  # ── BE EC2 배포 (Docker Hub pull → 컨테이너 교체) ──────────────────
  # Secrets: EC2_HOST, EC2_USER, EC2_SSH_KEY, DOCKERHUB_TOKEN
  # Variables: DOCKERHUB_USERNAME
  deploy-be:
    runs-on: ubuntu-latest
    needs: build-be
    steps:
      - name: EC2 BE 배포 (SSH)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            IMAGE="${{ vars.DOCKERHUB_USERNAME }}/be-fastapi-hello:latest"

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
              docker login -u "${{ vars.DOCKERHUB_USERNAME }}" --password-stdin

            docker pull "$IMAGE"

            docker stop fastapi-app 2>/dev/null || true
            docker rm   fastapi-app 2>/dev/null || true

            docker run -d \
              --name fastapi-app \
              --restart unless-stopped \
              -p 8000:8000 \
              "$IMAGE"

            docker image prune -f

            sleep 3
            curl -sf http://localhost:8000/health || \
              (echo "BE 헬스체크 실패"; docker logs fastapi-app --tail 30; exit 1)

  # ── FE EC2 배포 (Docker Hub pull → 컨테이너 교체) ──────────────────
  deploy-fe:
    runs-on: ubuntu-latest
    needs: build-fe
    steps:
      - name: EC2 FE 배포 (SSH)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            IMAGE="${{ vars.DOCKERHUB_USERNAME }}/fe-ag-grid:latest"

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
              docker login -u "${{ vars.DOCKERHUB_USERNAME }}" --password-stdin

            docker pull "$IMAGE"

            docker stop fe-ag-grid 2>/dev/null || true
            docker rm   fe-ag-grid 2>/dev/null || true

            docker run -d \
              --name fe-ag-grid \
              --restart unless-stopped \
              -p 80:80 \
              "$IMAGE"

            docker image prune -f

            sleep 2
            curl -sf http://localhost:80/ || \
              (echo "FE 헬스체크 실패"; docker logs fe-ag-grid --tail 30; exit 1)
